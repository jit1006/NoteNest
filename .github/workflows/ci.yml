name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify PDFs are reproducible and valid
        run: python3 tools/generate_pdfs.py && python3 tools/verify_pdfs.py && git diff --exit-code -- public/pdfs
      - name: Catalog integrity
        run: npm run check:data
      - name: Search / filter logic tests
        run: npm run test:logic
      - name: Typecheck and production build
        run: npm run build
      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: notenest-dist
          path: dist
